
name: Build TheSpoiledSeed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP found!"
            exit 1
          fi
          echo "ZIP=$ZIP"

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"

      - name: Build Mod
        run: |
          export JAVA_HOME=$JAVA_HOME_8_X64
          export PATH="$HOME/gradle-2.14.1/bin:$PATH"
          BUILD=$(find extracted -name build.gradle -print -quit)
          if [ -z "$BUILD" ]; then
            echo "build.gradle not found!"
            exit 1
          fi
          cd "$(dirname "$BUILD")"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TheSpoiledSeed-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
